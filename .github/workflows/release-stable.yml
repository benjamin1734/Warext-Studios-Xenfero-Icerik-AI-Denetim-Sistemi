name: Warext AI Content Inspector Stable Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stable sürüm kimliğini doğrula
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          addon = json.loads(Path('upload/src/addons/Warext/AIContentInspector/addon.json').read_text(encoding='utf-8'))
          if addon.get('version_string') != '1.0.2' or int(addon.get('version_id', 0)) != 1000320:
              raise SystemExit('Bu workflow yalnız v1.0.2 Stable için çalışır.')
          PY

      - name: PHP sözdizimini doğrula
        run: find upload/src/addons/Warext/AIContentInspector -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: JavaScript sözdizimini doğrula
        run: find upload/js/warext/ai-content-inspector -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: XenForo master-data ve template uyumluluğunu doğrula
        run: python3 tools/validate_xenforo_master.py

      - name: Stable XenForo ZIP paketini üret ve doğrula
        id: build
        run: |
          set -euo pipefail
          python3 tools/build_release.py
          PACKAGE="$(cat .release-package)"
          test -f "$PACKAGE"
          unzip -tq "$PACKAGE"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE"

      - name: Release notlarını hazırla
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Warext Studios | İçerik AI Denetim Sistemi v1.0.2 Stable

          XenForo 2.3+ template derleme ve ACP menü yerleşimi düzeltme sürümü. **v1.0.0 ve v1.0.1 yerine bu sürümü kullanın.**

          Kritik düzeltmeler:
          - `public:warext_ai_center` şablonunda kurulum sırasında oluşan `Line 51: Syntax error` giderildi.
          - PHP-benzeri kısa ternary/Elvis ifadelerinin `{$...}` doğrudan çıktı interpolasyonu içinde kullanılmasına son verildi.
          - Provider model, konu başlığı ve kullanıcı adı fallback'leri kanonik `<xf:if>` yapısına geçirildi.
          - Durum filtresi raw HTML option/attribute üretmek yerine XenForo'nun `<xf:select>` / `<xf:option>` bileşenine geçirildi.
          - Risk sınıfı üretimi açık XenForo koşullarıyla güvenli hale getirildi.

          ACP düzeni:
          - `Warext AI İçerik Denetimi` kök kategorisinin `display_order` değeri 95'ten 9000'e taşındı.
          - Böylece eklenti ayar grubu Setup / Add-ons gibi XenForo çekirdek kategorilerinin üstünde görünmez.

          Release güvenliği:
          - Yeni `tools/validate_xenforo_master.py` master-data, option formatları, phrase/nav yapıları ve template markup dengesini doğrular.
          - `{$x ?: y}` / `{$x ? y : z}` gibi XenForo template compiler'ını bozabilecek ifadeli basit interpolasyonlar CI tarafından bloklanır.
          - Template sürüm kimlikleri add-on sürümüyle eşleşmek zorundadır.
          - ACP kategori sırasının tekrar core menülerin üstüne çıkması CI tarafından engellenir.
          - Paketleme ve Release aşamalarında aynı sıkı doğrulama yeniden çalışır.

          Eklentinin AI analiz, moderasyon, opsiyonel provider, bütçe/maliyet, geçmiş tarama ve Writing Checker entegrasyon özellikleri korunur.

          Kurulum için Release altındaki `Warext-XenForo-Icerik-AI-Denetim-Sistemi-V1.0.2.zip` dosyasını kullanın.
          EOF

      - name: GitHub v1.0.2 Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          set -euo pipefail
          if gh release view v1.0.2 >/dev/null 2>&1; then
            echo 'v1.0.2 Release zaten mevcut; yeniden oluşturulmadı.'
            exit 0
          fi
          gh release create v1.0.2 \
            "$PACKAGE#XenForo 2.3+ kurulum ZIP" \
            --target "$GITHUB_SHA" \
            --title "Warext AI Content Inspector v1.0.2 Stable" \
            --notes-file RELEASE_NOTES.md \
            --latest
