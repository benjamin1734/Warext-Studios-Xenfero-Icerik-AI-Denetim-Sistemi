# v1.1.4 final release trigger
name: Warext AI Content Inspector Stable Release

on:
  push:
    branches: [main]
    paths:
      - 'upload/src/addons/Warext/AIContentInspector/addon.json'
      - '.github/workflows/release-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stable sürüm kimliğini oku ve doğrula
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          addon = json.loads(Path('upload/src/addons/Warext/AIContentInspector/addon.json').read_text(encoding='utf-8'))
          version = str(addon.get('version_string', '')).strip()
          version_id = int(addon.get('version_id', 0))
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or version_id <= 0:
              raise SystemExit('Stable sürüm kimliği geçersiz')
          print(f'version={version}')
          print(f'version_id={version_id}')
          print(f'tag=v{version}')
          PY

      - name: PHP sözdizimini doğrula
        run: find upload/src/addons/Warext/AIContentInspector -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: JavaScript sözdizimini doğrula
        run: find upload/js/warext/ai-content-inspector -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Provider ve kalibrasyon regresyonlarını çalıştır
        run: |
          php tests/analyzer_regression.php
          php tests/calibration_v114_regression.php
          php tests/openrouter_provider_regression.php
          php tests/direct_provider_regression.php
          php tests/openai_compatible_provider_regression.php

      - name: XenForo 2.3 JSON controller regresyonu
        run: python3 tests/json_controller_regression.py

      - name: XenForo master-data, template ve kurulum uyumluluğunu doğrula
        run: python3 tools/validate_xenforo_master.py

      - name: Mesaj-seviyesi analiz ve inline rapor regresyonları
        run: python3 tools/validate_v112.py

      - name: v1.1.4 manuel derin analiz ve skor izi doğrulaması
        run: python3 tools/validate_v114.py

      - name: Stable XenForo ZIP paketini üret ve doğrula
        id: build
        run: |
          set -euo pipefail
          python3 tools/build_release.py
          PACKAGE="$(cat .release-package)"
          test -f "$PACKAGE"
          unzip -tq "$PACKAGE"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE"

      - name: Release notlarını hazırla
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          notes = f'''# Warext Studios | İçerik AI Denetim Sistemi v{version} Stable

          Canlı false-negative düzeltmesi, manuel derin analiz ve şeffaf skor zinciri.

          - Aynı metnin canlıda 28/100 risk ve 56/100 güven civarında kalabildiği çoklu-sinyal kalibrasyon boşluğu düzeltildi.
          - 5+ bağımsız güçlü dil/yapı sinyali taşıyan yeterli uzunluktaki metinler artık tek tek zayıf sinyaller gibi değerlendirilmez.
          - Düşük risk + düşük/orta güven sonucu artık insan yazarlığının kanıtı sayılmaz; gerektiğinde `Belirsiz / güven yetersiz` sınıfına düşer.
          - Manuel mesaj analizi, yapılandırılmış harici sağlayıcı varsa yerel risk API eşiğinin altında kalsa bile harici ikinci görüşü zorlayabilir.
          - Zaten arka plan harici doğrulama jobu sıradaysa duplicate API çağrısı yapılmaz; konu içi rapor nihai sonucu otomatik takip eder.
          - Yerel ve harici skorlar güçlü biçimde çeliştiğinde tek taraf körlemesine kazanmaz; sonuç inceleme seviyesine taşınır ve çelişki sinyali kaydedilir.
          - Inline raporda Ham yerel skor → Kalibre yerel skor → Harici sağlayıcı skoru → Nihai skor zinciri, motor sürümü ve kalibrasyon nedeni görünür.
          - Risk değerinin matematiksel AI olasılık yüzdesi değil moderasyon risk skoru olduğu arayüzde açıkça belirtilir.
          - `LocalCalibration` ve `ExternalScoreFusion` servisleri Stable ZIP için zorunlu hale getirildi ve özel regresyon testlerine bağlandı.

          Manuel SQL gerekmez. Mevcut kurulumu kaldırmadan Release altındaki `Warext-XenForo-Icerik-AI-Denetim-Sistemi-V{version}.zip` dosyasını yükleyip XenForo üzerinden yükseltin.
          '''
          Path('RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          PY

      - name: GitHub Stable Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.build.outputs.package }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG Release zaten mevcut; yeniden oluşturulmadı."
            exit 0
          fi
          gh release create "$TAG" \
            "$PACKAGE#XenForo 2.3+ kurulum ZIP" \
            --target "$GITHUB_SHA" \
            --title "Warext AI Content Inspector v${VERSION} Stable" \
            --notes-file RELEASE_NOTES.md \
            --latest
