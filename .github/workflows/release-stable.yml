name: Warext AI Content Inspector Stable Release

on:
  push:
    branches: [main]
    paths:
      - 'upload/src/addons/Warext/AIContentInspector/addon.json'
      - '.github/workflows/release-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stable sürüm kimliğini oku ve doğrula
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          addon = json.loads(Path('upload/src/addons/Warext/AIContentInspector/addon.json').read_text(encoding='utf-8'))
          version = str(addon.get('version_string', '')).strip()
          version_id = int(addon.get('version_id', 0))
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or version_id <= 0:
              raise SystemExit('Stable sürüm kimliği geçersiz')
          print(f'version={version}')
          print(f'version_id={version_id}')
          print(f'tag=v{version}')
          PY

      - name: PHP sözdizimini doğrula
        run: find upload/src/addons/Warext/AIContentInspector -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: JavaScript sözdizimini doğrula
        run: find upload/js/warext/ai-content-inspector -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Provider regresyonlarını çalıştır
        run: |
          php tests/analyzer_regression.php
          php tests/openrouter_provider_regression.php
          php tests/direct_provider_regression.php
          php tests/openai_compatible_provider_regression.php

      - name: XenForo master-data, template ve kurulum uyumluluğunu doğrula
        run: python3 tools/validate_xenforo_master.py

      - name: Stable XenForo ZIP paketini üret ve doğrula
        id: build
        run: |
          set -euo pipefail
          python3 tools/build_release.py
          PACKAGE="$(cat .release-package)"
          test -f "$PACKAGE"
          unzip -tq "$PACKAGE"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE"

      - name: Release notlarını hazırla
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          notes = f'''# Warext Studios | İçerik AI Denetim Sistemi v{version} Stable

          XenForo 2.3+ moderasyon erişimi ve forum seçim arayüzü güncellemesi.

          Yeni kullanım akışı:
          - Konu sayfasının üstündeki üç nokta / konu araçları menüsüne `Konuyu AI ile analiz et` eylemi eklendi.
          - Tek mesaj için `Bu mesajı AI ile analiz et` eylemi mesajın kendi moderatör eylemleri menüsünde korunur.
          - Her iki manuel eylem yalnız `warextAiReview` veya `warextAiManage` yetkisi bulunan kullanıcılara gösterilir.
          - Konu analizi görünür mesajları XenForo job kuyruğuna alır ve sayfa isteğini bloklamaz.

          Forum seçimi:
          - `Analiz edilecek forumlar` alanı eski çoklu select kutusundan checkbox listesine geçirildi.
          - Her forum `Kategori › Alt kategori › Forum` yolu ile gösterilir; seçili forumlar doğrudan tick ile görülebilir.
          - Hiçbir checkbox seçilmezse mevcut davranış korunur ve tüm forumlar otomatik analize dahil edilir.
          - Veritabanında yalnız gerçek forum ID'leri saklanır; kategori/forum ID karışıklığı oluşturulmaz.

          Release güvenliği:
          - Stable validator özel forum checkbox callback'ini ve konu üst menü entegrasyonunu zorunlu doğrular.
          - Stable ZIP `Option/Forum.php`, `ManualAnalyze.php` ve `manual-analysis.js` dosyalarını zorunlu runtime dosyaları olarak kontrol eder.
          - Frontend cache anahtarı `1000370` olarak güncellendi.

          Manuel SQL gerekmez. Mevcut kurulumu kaldırmadan Release altındaki `Warext-XenForo-Icerik-AI-Denetim-Sistemi-V{version}.zip` dosyasını yükleyip XenForo üzerinden yükseltin.
          '''
          Path('RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          PY

      - name: GitHub Stable Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.build.outputs.package }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG Release zaten mevcut; yeniden oluşturulmadı."
            exit 0
          fi
          gh release create "$TAG" \
            "$PACKAGE#XenForo 2.3+ kurulum ZIP" \
            --target "$GITHUB_SHA" \
            --title "Warext AI Content Inspector v${VERSION} Stable" \
            --notes-file RELEASE_NOTES.md \
            --latest
