name: Warext AI Content Inspector Stable Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stable sürüm kimliğini doğrula
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          addon = json.loads(Path('upload/src/addons/Warext/AIContentInspector/addon.json').read_text(encoding='utf-8'))
          if addon.get('version_string') != '1.0.1' or int(addon.get('version_id', 0)) != 1000310:
              raise SystemExit('Bu workflow yalnız v1.0.1 Stable için çalışır.')
          PY

      - name: PHP sözdizimini doğrula
        run: find upload/src/addons/Warext/AIContentInspector -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: JavaScript sözdizimini doğrula
        run: find upload/js/warext/ai-content-inspector -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: XenForo master-data uyumluluğunu doğrula
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          data = Path('upload/src/addons/Warext/AIContentInspector/_data')
          for path in sorted(data.glob('*.xml')):
              ET.parse(path)

          options = ET.parse(data / 'options.xml').getroot()
          allowed = {'textbox','spinbox','onoff','onofftextbox','radio','select','checkbox','template','callback','username'}
          invalid = {o.attrib.get('option_id'): o.attrib.get('edit_format') for o in options.findall('option') if o.attrib.get('edit_format') not in allowed}
          if invalid:
              raise SystemExit('Geçersiz XenForo option edit formatı: ' + repr(invalid))
          if any(o.attrib.get('edit_format') == 'textarea' for o in options.findall('option')):
              raise SystemExit('XenForo edit_format=textarea kabul etmez')

          admin_nav = ET.parse(data / 'admin_navigation.xml').getroot()
          ids = {n.attrib.get('navigation_id') for n in admin_nav.findall('admin_navigation_entry')}
          if not {'warextAiAdmin', 'warextAiSettings'}.issubset(ids):
              raise SystemExit('ACP navigation export formatı geçersiz')

          phrases = {p.attrib.get('title') for p in ET.parse(data / 'phrases.xml').getroot().findall('phrase')}
          for title in ['permission_interface.warextAi','option_group.warextAi','admin_navigation.warextAiAdmin','nav.warextAi']:
              if title not in phrases:
                  raise SystemExit('Kanonik XenForo phrase eksik: ' + title)
          PY

      - name: Stable XenForo ZIP paketini üret ve doğrula
        id: build
        run: |
          set -euo pipefail
          python3 tools/build_release.py
          PACKAGE="$(cat .release-package)"
          test -f "$PACKAGE"
          unzip -tq "$PACKAGE"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE"

      - name: Release notlarını hazırla
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Warext Studios | İçerik AI Denetim Sistemi v1.0.1 Stable

          XenForo 2.3+ kurulum uyumluluğu düzeltme sürümü. **v1.0.0 yerine bu sürümü kullanın.**

          Düzeltilen kritik kurulum sorunu:
          - v1.0.0 kurulumu sırasında görülebilen `Exception: Please enter a valid value.` hatasının kök nedeni giderildi.
          - `warextAiOpenRouterFallbackModels` seçeneğindeki XenForo tarafından desteklenmeyen `edit_format="textarea"`, kanonik `textbox` + çok satırlı `rows=4` yapılandırmasına çevrildi.

          Ek XenForo 2.3 master-data düzeltmeleri:
          - Forum selector callback'i kanonik `XF\Option\Forum::renderSelectMultiple` biçimine geçirildi.
          - ACP navigation XML'i gerçek XenForo `admin_navigation_entry` export şemasına dönüştürüldü.
          - Public navigation yetki koşulu XenForo template sözdizimine düzeltildi.
          - Permission, option, option-group ve navigation phrase anahtarları XenForo'nun kanonik noktalı biçimine geçirildi.
          - Başarısız v1.0.0 kurulumundan kalabilecek analiz tablosu için yeniden kurulum/retry koruması eklendi.
          - CI artık desteklenmeyen option edit formatlarını ve hatalı master-data yapılarını release öncesinde blokluyor.

          Eklentinin AI analiz, moderasyon, opsiyonel provider, bütçe/maliyet, geçmiş tarama ve Writing Checker entegrasyon özellikleri korunur.

          Kurulum için Release altındaki `Warext-XenForo-Icerik-AI-Denetim-Sistemi-V1.0.1.zip` dosyasını kullanın.
          EOF

      - name: GitHub v1.0.1 Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          set -euo pipefail
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo 'v1.0.1 Release zaten mevcut; yeniden oluşturulmadı.'
            exit 0
          fi
          gh release create v1.0.1 \
            "$PACKAGE#XenForo 2.3+ kurulum ZIP" \
            --target "$GITHUB_SHA" \
            --title "Warext AI Content Inspector v1.0.1 Stable" \
            --notes-file RELEASE_NOTES.md \
            --latest
