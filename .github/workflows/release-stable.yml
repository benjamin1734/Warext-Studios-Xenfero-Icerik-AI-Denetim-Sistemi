name: Warext AI Content Inspector Stable Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stable sürüm kimliğini oku ve doğrula
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          addon = json.loads(Path('upload/src/addons/Warext/AIContentInspector/addon.json').read_text(encoding='utf-8'))
          version = str(addon.get('version_string', '')).strip()
          version_id = int(addon.get('version_id', 0))
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or version_id <= 0:
              raise SystemExit('Stable sürüm kimliği geçersiz')
          print(f'version={version}')
          print(f'version_id={version_id}')
          print(f'tag=v{version}')
          PY

      - name: PHP sözdizimini doğrula
        run: find upload/src/addons/Warext/AIContentInspector -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: JavaScript sözdizimini doğrula
        run: find upload/js/warext/ai-content-inspector -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Provider regresyonlarını çalıştır
        run: |
          php tests/analyzer_regression.php
          php tests/openrouter_provider_regression.php
          php tests/direct_provider_regression.php
          php tests/openai_compatible_provider_regression.php

      - name: XenForo master-data, template ve kurulum uyumluluğunu doğrula
        run: python3 tools/validate_xenforo_master.py

      - name: Stable XenForo ZIP paketini üret ve doğrula
        id: build
        run: |
          set -euo pipefail
          python3 tools/build_release.py
          PACKAGE="$(cat .release-package)"
          test -f "$PACKAGE"
          unzip -tq "$PACKAGE"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE"

      - name: Release notlarını hazırla
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > RELEASE_NOTES.md <<EOF
          # Warext Studios | İçerik AI Denetim Sistemi v${VERSION} Stable

          XenForo 2.3+ ACP ayar erişimi ve yüksek riskli konu görünümü düzeltme sürümü.

          Ayarlar düzeltmesi:
          - ACP Ayarlar bağlantısı artık sorunlu `options/groups/warextAi/` yoluna bağlı değildir.
          - XenForo'nun add-on bazlı kanonik seçenek yolu `add-ons/Warext-AIContentInspector/options` kullanılır.
          - `warextAi` option group temiz kurulumun ilk adımında, ikinci kurulum adımında ve yükseltmede tekrar doğrulanır.
          - Böylece option-group kaydı eksik/kısmi olsa bile yönetici ayarlara add-on üzerinden ulaşabilir.

          ACP yüksek risk alanı:
          - `Warext AI İçerik Denetimi` ana ACP kategorisi yüksek risk görünümünü açar.
          - Yüksek risk görünümü AI Denetim Merkezi'ni minimum 70/100 risk filtresiyle açar.
          - `Ayarlar` alt menüsü ayrı kalır ve doğrudan add-on seçeneklerine gider.

          Konu üstü yetkili deneyimi:
          - `AI Analizi`, `Konuyu analiz et` ve `Eksik mesajları tara` akışı korunur.
          - Analizli mesajlarda kısa risk kartı ve yetkisi olanlarda `Detaylı rapor` kullanılabilir.

          Release güvenliği:
          - Validator artık add-on options route'unu, ACP yüksek risk route/controller'ını ve temiz kurulum option-group doğrulamasını zorunlu tutar.
          - Final ZIP, HighRisk controller, ThreadAnalyze controller ve thread-controls.js olmadan üretilemez.

          Kurulum/yükseltme için Release altındaki `Warext-XenForo-Icerik-AI-Denetim-Sistemi-V${VERSION}.zip` dosyasını kullanın.
          EOF

      - name: GitHub Stable Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.build.outputs.package }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG Release zaten mevcut; yeniden oluşturulmadı."
            exit 0
          fi
          gh release create "$TAG" \
            "$PACKAGE#XenForo 2.3+ kurulum ZIP" \
            --target "$GITHUB_SHA" \
            --title "Warext AI Content Inspector v${VERSION} Stable" \
            --notes-file RELEASE_NOTES.md \
            --latest
