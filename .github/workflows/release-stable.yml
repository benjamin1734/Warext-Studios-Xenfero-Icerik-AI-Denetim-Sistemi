# v1.1.3 final release trigger
name: Warext AI Content Inspector Stable Release

on:
  push:
    branches: [main]
    paths:
      - 'upload/src/addons/Warext/AIContentInspector/addon.json'
      - '.github/workflows/release-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stable sürüm kimliğini oku ve doğrula
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          addon = json.loads(Path('upload/src/addons/Warext/AIContentInspector/addon.json').read_text(encoding='utf-8'))
          version = str(addon.get('version_string', '')).strip()
          version_id = int(addon.get('version_id', 0))
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or version_id <= 0:
              raise SystemExit('Stable sürüm kimliği geçersiz')
          print(f'version={version}')
          print(f'version_id={version_id}')
          print(f'tag=v{version}')
          PY

      - name: PHP sözdizimini doğrula
        run: find upload/src/addons/Warext/AIContentInspector -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: JavaScript sözdizimini doğrula
        run: find upload/js/warext/ai-content-inspector -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Provider ve kalibrasyon regresyonlarını çalıştır
        run: |
          php tests/analyzer_regression.php
          php tests/openrouter_provider_regression.php
          php tests/direct_provider_regression.php
          php tests/openai_compatible_provider_regression.php

      - name: XenForo 2.3 JSON controller regresyonu
        run: python3 tests/json_controller_regression.py

      - name: XenForo master-data, template ve kurulum uyumluluğunu doğrula
        run: python3 tools/validate_xenforo_master.py

      - name: Mesaj-seviyesi analiz ve inline rapor regresyonları
        run: python3 tools/validate_v112.py

      - name: Stable XenForo ZIP paketini üret ve doğrula
        id: build
        run: |
          set -euo pipefail
          python3 tools/build_release.py
          PACKAGE="$(cat .release-package)"
          test -f "$PACKAGE"
          unzip -tq "$PACKAGE"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE"

      - name: Release notlarını hazırla
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          notes = f'''# Warext Studios | İçerik AI Denetim Sistemi v{version} Stable

          AI false-negative kalibrasyonu ve çoklu sinyal motoru güncellemesi.

          - Tamamen AI üslubundaki uzun ve aşırı düzenli metinlerin yanlış biçimde `İnsan yazımı ağırlıklı` sayılmasına yol açan muhafazakâr puanlama düzeltildi.
          - Yerel analiz motoruna genişletilmiş Türkçe şablon kalıpları, formülsel anlatım yoğunluğu, geçiş ifadesiyle cümle başlatma oranı ve biçimsel cümle ritmi sinyalleri eklendi.
          - Tek bir düzgün-yazım sinyali yerine birden fazla bağımsız sinyal aynı yönde birleştiğinde çalışan `multi_signal_consistency` katkısı eklendi.
          - Editör davranışı gözlemlenmediyse artık varsayımsal davranış puanı verilmez; veri yokluğu nötr kabul edilir.
          - Writing Checker düzeltmelerinin riski gereğinden fazla düşürmesi engellendi; proofreading en fazla küçük bir bağlamsal düzeltme yapabilir.
          - Risk sınıflandırması Analyzer, kullanıcı profili ve harici doğrulama servislerinde tek `RiskClassifier` üzerinden eşitlendi.
          - Harici AI ikinci görüş promptu yeni 0-24 / 25-44 / 45-64 / 65-79 / 80-100 kalibrasyon bantlarına göre güncellendi.
          - Regresyon kapısına belirgin AI metni, doğal forum mesajı ve düzgün teknik insan metni örnekleri eklendi. Release yalnız AI örneği >=70, doğal forum örneği <55 ve teknik insan örneği <65 olduğunda üretilebilir.
          - Mesajın kendi üç nokta menüsünden tek-mesaj analizi ve konu içinde doğrudan inline rapor sistemi korunur.

          Manuel SQL gerekmez. Mevcut kurulumu kaldırmadan Release altındaki `Warext-XenForo-Icerik-AI-Denetim-Sistemi-V{version}.zip` dosyasını yükleyip XenForo üzerinden yükseltin.
          '''
          Path('RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          PY

      - name: GitHub Stable Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.build.outputs.package }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG Release zaten mevcut; yeniden oluşturulmadı."
            exit 0
          fi
          gh release create "$TAG" \
            "$PACKAGE#XenForo 2.3+ kurulum ZIP" \
            --target "$GITHUB_SHA" \
            --title "Warext AI Content Inspector v${VERSION} Stable" \
            --notes-file RELEASE_NOTES.md \
            --latest
