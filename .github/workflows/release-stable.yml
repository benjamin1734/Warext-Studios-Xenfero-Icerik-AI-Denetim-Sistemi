name: Warext AI Content Inspector Stable Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stable sürüm kimliğini doğrula
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          addon = json.loads(Path('upload/src/addons/Warext/AIContentInspector/addon.json').read_text(encoding='utf-8'))
          if addon.get('version_string') != '1.0.0' or int(addon.get('version_id', 0)) != 1000300:
              raise SystemExit('Bu workflow yalnız v1.0.0 Stable için çalışır.')
          PY

      - name: PHP sözdizimini doğrula
        run: find upload/src/addons/Warext/AIContentInspector -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: JavaScript sözdizimini doğrula
        run: find upload/js/warext/ai-content-inspector -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Stable XenForo ZIP paketini üret ve doğrula
        id: build
        run: |
          set -euo pipefail
          python3 tools/build_release.py
          PACKAGE="$(cat .release-package)"
          test -f "$PACKAGE"
          unzip -tq "$PACKAGE"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE"

      - name: Release notlarını hazırla
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Warext Studios | İçerik AI Denetim Sistemi v1.0.0 Stable

          XenForo 2.3+ için kararlı ilk sürüm.

          Öne çıkanlar:
          - Harici API zorunlu olmayan Warext Local Engine.
          - Metin yapısı, editör davranışı, kullanıcı yazım profili ve içerik benzerliği tabanlı çoklu sinyal analizi.
          - Opsiyonel OpenRouter, OpenAI/GPT, Gemini, DeepSeek, Claude, Grok, Mistral, Qwen, Ollama ve özel OpenAI-compatible ikinci görüş.
          - Harici doğrulamalar XenForo job kuyruğunda asenkron çalışır.
          - Günlük/aylık API istek ve bütçe sınırları.
          - Gerçek, tahmini ve bilinmeyen maliyet ayrımı; token bazlı tahmini maliyet fallback'i.
          - Provider sağlık ve kullanım görünümü.
          - Kontrollü geçmiş içerik taraması.
          - Düz/detaylı rapor yetkileri ve moderasyon inceleme geçmişi.
          - Değişmemiş içerik için duplicate-analysis engeli ve Stable sorgu optimizasyonları.

          Sistem kesin AI hükmü veya otomatik ceza üretmez; risk ve güven skorları moderasyon kararını desteklemek için kullanılır.

          Kurulum için Release altındaki `Warext-XenForo-Icerik-AI-Denetim-Sistemi-V1.0.0.zip` dosyasını kullanın.
          EOF

      - name: GitHub v1.0.0 Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'v1.0.0 Release zaten mevcut; yeniden oluşturulmadı.'
            exit 0
          fi
          gh release create v1.0.0 \
            "$PACKAGE#XenForo 2.3+ kurulum ZIP" \
            --target "$GITHUB_SHA" \
            --title "Warext AI Content Inspector v1.0.0 Stable" \
            --notes-file RELEASE_NOTES.md \
            --latest
