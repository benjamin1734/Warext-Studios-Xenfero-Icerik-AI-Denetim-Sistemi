name: Warext AI Content Inspector Stable Release

on:
  push:
    branches: [main]
    paths:
      - 'upload/src/addons/Warext/AIContentInspector/addon.json'
      - '.github/workflows/release-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stable sürüm kimliğini oku ve doğrula
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          addon = json.loads(Path('upload/src/addons/Warext/AIContentInspector/addon.json').read_text(encoding='utf-8'))
          version = str(addon.get('version_string', '')).strip()
          version_id = int(addon.get('version_id', 0))
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or version_id <= 0:
              raise SystemExit('Stable sürüm kimliği geçersiz')
          print(f'version={version}')
          print(f'version_id={version_id}')
          print(f'tag=v{version}')
          PY

      - name: PHP sözdizimini doğrula
        run: find upload/src/addons/Warext/AIContentInspector -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: JavaScript sözdizimini doğrula
        run: find upload/js/warext/ai-content-inspector -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Provider regresyonlarını çalıştır
        run: |
          php tests/analyzer_regression.php
          php tests/openrouter_provider_regression.php
          php tests/direct_provider_regression.php
          php tests/openai_compatible_provider_regression.php

      - name: XenForo master-data, template ve kurulum uyumluluğunu doğrula
        run: python3 tools/validate_xenforo_master.py

      - name: Stable XenForo ZIP paketini üret ve doğrula
        id: build
        run: |
          set -euo pipefail
          python3 tools/build_release.py
          PACKAGE="$(cat .release-package)"
          test -f "$PACKAGE"
          unzip -tq "$PACKAGE"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE"

      - name: Release notlarını hazırla
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          notes = f'''# Warext Studios | İçerik AI Denetim Sistemi v{version} Stable

          XenForo 2.3+ moderatör manuel analiz ve mesaj eylemleri sürümü.

          Yeni moderasyon akışı:
          - Mesajların üç nokta / moderatör eylemleri menüsüne `AI ile manuel analiz et` eylemi eklendi.
          - Eylem yalnız `warextAiReview` veya `warextAiManage` yetkisi bulunan kullanıcılara gösterilir.
          - Aynı içerik daha önce analiz edilmiş olsa bile moderatör manuel olarak yeniden analiz çalıştırabilir.
          - ACP otomatik tarama forum seçimi manuel moderatör çalıştırmasını engellemez.
          - Otomatik analiz eşiğinin altındaki içerikler manuel çalıştırılabilir; 80 karakterden kısa içerikte yanıltıcı skor üretmek yerine yetersiz metin uyarısı döner.
          - Manuel çalıştırmada geçmiş editör/paste/Writing Checker verisi uydurulmaz ve gözlemlenmemiş olarak kaydedilir.
          - Yerel sonuç konu ekranındaki mevcut kısa rapora anında yansıtılır.
          - Harici ikinci görüş etkinse mevcut risk eşiği, provider ayarları, istek limitleri ve bütçe sınırları korunur; gerekli doğrulama arka plan job kuyruğuna gider.

          Release güvenliği:
          - Manuel analiz endpoint'i POST + XenForo CSRF akışıyla çalışır.
          - Release validator manuel route, controller, post action menu entegrasyonu ve tarayıcı kodunu zorunlu olarak doğrular.
          - Stable ZIP doğrulaması `ManualAnalyze.php` ve `manual-analysis.js` dosyalarını zorunlu runtime dosyaları olarak kontrol eder.
          - Frontend cache anahtarı `1000360` olarak güncellendi.

          Manuel SQL gerekmez. Mevcut kurulumu kaldırmadan Release altındaki `Warext-XenForo-Icerik-AI-Denetim-Sistemi-V{version}.zip` dosyasını yükleyip XenForo üzerinden yükseltin.
          '''
          Path('RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          PY

      - name: GitHub Stable Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.build.outputs.package }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG Release zaten mevcut; yeniden oluşturulmadı."
            exit 0
          fi
          gh release create "$TAG" \
            "$PACKAGE#XenForo 2.3+ kurulum ZIP" \
            --target "$GITHUB_SHA" \
            --title "Warext AI Content Inspector v${VERSION} Stable" \
            --notes-file RELEASE_NOTES.md \
            --latest
