name: Warext AI Content Inspector Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: find upload/src/addons/Warext/AIContentInspector -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Analyzer false-positive regresyonları
        run: php tests/analyzer_regression.php

      - name: OpenRouter provider regresyonları
        run: php tests/openrouter_provider_regression.php

      - name: Doğrudan provider regresyonları
        run: php tests/direct_provider_regression.php

      - name: OpenAI-compatible provider regresyonları
        run: php tests/openai_compatible_provider_regression.php

      - name: JavaScript syntax
        run: find upload/js/warext/ai-content-inspector -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: XenForo data and architecture validation
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('upload/src/addons/Warext/AIContentInspector')
          addon = json.loads((root / 'addon.json').read_text(encoding='utf-8'))
          if addon.get('version_string') != '1.0.0 Alpha 12' or int(addon.get('version_id', 0)) != 1000180:
              raise SystemExit('Beklenmeyen addon sürümü')
          if int(addon.get('require', {}).get('XF', [0])[0]) < 2030070:
              raise SystemExit('XenForo 2.3+ gereksinimi eksik')
          if 'Warext/TurkishSpellCheck' in json.dumps(addon, ensure_ascii=False):
              raise SystemExit('Writing Checker zorunlu bağımlılık olamaz')

          data = root / '_data'
          for path in sorted(data.glob('*.xml')):
              ET.parse(path)

          groups = {g.attrib.get('group_id') for g in ET.parse(data / 'option_groups.xml').getroot().findall('option_group')}
          if 'warextAi' not in groups:
              raise SystemExit('AI ayarları için ayrı XenForo option group eksik')

          admin_nav = ET.parse(data / 'admin_navigation.xml').getroot()
          nav_ids = {n.attrib.get('id') for n in admin_nav.findall('nav')}
          if not {'warextAiAdmin', 'warextAiSettings'}.issubset(nav_ids):
              raise SystemExit('Ayrı ACP Warext AI navigasyonu eksik')
          admin_text = (data / 'admin_navigation.xml').read_text(encoding='utf-8')
          for marker in ['parent_id="home"', 'options/groups/warextAi', 'fa-robot']:
              if marker not in admin_text:
                  raise SystemExit('ACP kategori yapısı eksik: ' + marker)

          permissions = ET.parse(data / 'permissions.xml').getroot()
          actual = {p.attrib.get('permission_id') for p in permissions.findall('permission')}
          required = {'warextAiViewSimple', 'warextAiViewDetailed', 'warextAiReview', 'warextAiManage'}
          if not required.issubset(actual):
              raise SystemExit('Yetki tanımları eksik')

          options = ET.parse(data / 'options.xml').getroot()
          option_ids = {o.attrib.get('option_id') for o in options.findall('option')}
          required_options = {
              'warextAiExternalProvider', 'warextAiDailyRequestLimit', 'warextAiDailyBudgetUsd',
              'warextAiMonthlyBudgetUsd', 'warextAiUsageRetentionDays', 'warextAiHistoryBatchSize'
          }
          if not required_options.issubset(option_ids):
              raise SystemExit('Alpha 12 bütçe/geçmiş ayarları eksik: ' + ', '.join(sorted(required_options - option_ids)))

          phrases = ET.parse(data / 'phrases.xml').getroot()
          phrase_titles = {p.attrib.get('title') for p in phrases.findall('phrase')}
          required_phrases = {
              'option_warextAiDailyRequestLimit', 'option_warextAiDailyBudgetUsd',
              'option_warextAiMonthlyBudgetUsd', 'option_warextAiUsageRetentionDays',
              'option_warextAiHistoryBatchSize'
          }
          if not required_phrases.issubset(phrase_titles):
              raise SystemExit('Alpha 12 seçenek phrase kayıtları eksik')

          cron = ET.parse(data / 'cron_entries.xml').getroot()
          cron_ids = {e.attrib.get('cron_entry_id') for e in cron.findall('cron_entry')}
          if 'warextAiUsagePrune' not in cron_ids:
              raise SystemExit('Usage prune cron eksik')

          post = (root / 'XF/Entity/Post.php').read_text(encoding='utf-8')
          for marker in ['Registry', 'UserProfile', 'Similarity', 'warextPrepareExternalState', 'warextQueueExternalVerification', 'enqueueUnique', 'ExternalVerify', 'external_metrics', 'content_fingerprint']:
              if marker not in post:
                  raise SystemExit('Post analiz/provider zinciri eksik: ' + marker)
          if '(new ExternalVerifier())->enrich' in post:
              raise SystemExit('Harici provider mesaj kaydı sırasında senkron çalışmamalı')

          provider = root / 'Provider'
          for name in ['ProviderInterface.php','LocalProvider.php','Registry.php','OpenRouterProvider.php','AbstractJsonProvider.php','OpenAICompatibleProvider.php','OpenAIProvider.php','GeminiProvider.php','DeepSeekProvider.php','AnthropicProvider.php']:
              if not (provider / name).exists():
                  raise SystemExit('Provider mimarisi eksik: ' + name)

          registry = (provider / 'Registry.php').read_text(encoding='utf-8')
          for marker in ['openrouter','openai','gemini','deepseek','anthropic','xai','mistral','qwen','ollama','custom_openai']:
              if marker not in registry:
                  raise SystemExit('Provider registry kaydı eksik: ' + marker)

          usage = root / 'Service/UsageTracker.php'
          if not usage.exists():
              raise SystemExit('UsageTracker eksik')
          usage_text = usage.read_text(encoding='utf-8')
          for marker in ['canRequest', 'record', 'summary', 'prune', 'daily_request_limit', 'daily_budget_limit', 'monthly_budget_limit', 'success_rate', 'last_failure_reason', 'warextAiUsageRetentionDays']:
              if marker not in usage_text:
                  raise SystemExit('Maliyet/kullanım takip özelliği eksik: ' + marker)

          historical = root / 'Service/HistoricalAnalyzer.php'
          history_job = root / 'Job/HistoricalScan.php'
          if not historical.exists() or not history_job.exists():
              raise SystemExit('Geçmiş içerik tarama katmanı eksik')
          historical_text = historical.read_text(encoding='utf-8')
          for marker in ['historical_unobserved', 'historical_behavior_unavailable', 'includeExternal', 'ExternalVerify', 'content_fingerprint']:
              if marker not in historical_text:
                  raise SystemExit('HistoricalAnalyzer özelliği eksik: ' + marker)
          history_job_text = history_job.read_text(encoding='utf-8')
          for marker in ['NOT EXISTS', 'warextAiHistoryBatchSize', 'include_external', 'resume()', 'canCancel']:
              if marker not in history_job_text:
                  raise SystemExit('HistoricalScan job özelliği eksik: ' + marker)

          verifier = (root / 'Service/ExternalVerifier.php').read_text(encoding='utf-8')
          for marker in ['UsageTracker', 'canRequest', 'external_budget_limit', 'usage_summary', 'external_provider_verification']:
              if marker not in verifier:
                  raise SystemExit('Harici doğrulama bütçe entegrasyonu eksik: ' + marker)

          external_job = (root / 'Job/ExternalVerify.php').read_text(encoding='utf-8')
          for marker in ["['post_id' => $postId]", 'hash_equals', 'ExternalVerifier']:
              if marker not in external_job:
                  raise SystemExit('Harici job kullanım kaydı bağlamı eksik: ' + marker)

          report = (root / 'Pub/Controller/Report.php').read_text(encoding='utf-8')
          for marker in ['canManage', 'UsageTracker', 'actionHistoryScan', 'warextAiHistoryScan', 'include_external']:
              if marker not in report:
                  raise SystemExit('Yönetim/usage/geçmiş tarama controller akışı eksik: ' + marker)

          templates = (data / 'templates.xml').read_text(encoding='utf-8')
          for marker in ['Harici AI kullanımı ve provider sağlığı', 'Geçmiş içerik taraması', 'usage.providers', 'history-scan']:
              if marker not in templates:
                  raise SystemExit('Alpha 12 yönetim arayüzü eksik: ' + marker)

          prune = root / 'Cron/UsagePrune.php'
          if not prune.exists() or 'UsageTracker' not in prune.read_text(encoding='utf-8'):
              raise SystemExit('Usage prune callback eksik')

          setup = (root / 'Setup.php').read_text(encoding='utf-8')
          for marker in ['upgrade1000170Step1', 'createUsageTable', 'xf_warext_ai_usage', 'cost_microusd', 'provider_date']:
              if marker not in setup:
                  raise SystemExit('Kullanım tablosu upgrade şeması eksik: ' + marker)

          print(json.dumps({
              'status':'ok',
              'version':'1.0.0 Alpha 12',
              'permissions':sorted(required),
              'separateOptionGroup':True,
              'separateAdminNavigation':True,
              'hardDependency':False,
              'providerArchitecture':True,
              'openRouterRecommended':True,
              'directProviders':True,
              'externalAsyncJob':True,
              'usageTracking':True,
              'providerHealthSummary':True,
              'dailyRequestLimit':True,
              'dailyBudgetLimit':True,
              'monthlyBudgetLimit':True,
              'usageRetentionCron':True,
              'historicalScanJob':True,
              'historicalExternalOptIn':True,
              'threadAggregateReport':True,
              'reviewAuditLog':True,
              'contentFingerprint':True
          }, ensure_ascii=False))
          PY
