name: Warext AI Content Inspector Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: find upload/src/addons/Warext/AIContentInspector -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Analyzer false-positive regresyonları
        run: php tests/analyzer_regression.php

      - name: OpenRouter provider regresyonları
        run: php tests/openrouter_provider_regression.php

      - name: Doğrudan provider regresyonları
        run: php tests/direct_provider_regression.php

      - name: OpenAI-compatible provider regresyonları
        run: php tests/openai_compatible_provider_regression.php

      - name: JavaScript syntax
        run: find upload/js/warext/ai-content-inspector -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: XenForo Stable release validation
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('upload/src/addons/Warext/AIContentInspector')
          addon = json.loads((root / 'addon.json').read_text(encoding='utf-8'))
          if addon.get('version_string') != '1.0.0' or int(addon.get('version_id', 0)) != 1000300:
              raise SystemExit('Stable sürüm kimliği beklenenden farklı')
          if int(addon.get('require', {}).get('XF', [0])[0]) < 2030070:
              raise SystemExit('XenForo 2.3+ gereksinimi eksik')
          if 'Warext/TurkishSpellCheck' in json.dumps(addon, ensure_ascii=False):
              raise SystemExit('Writing Checker zorunlu bağımlılık olamaz')

          data = root / '_data'
          for path in sorted(data.glob('*.xml')):
              ET.parse(path)

          groups = {g.attrib.get('group_id') for g in ET.parse(data / 'option_groups.xml').getroot().findall('option_group')}
          if 'warextAi' not in groups:
              raise SystemExit('AI ayarları için ayrı XenForo option group eksik')

          admin_nav = ET.parse(data / 'admin_navigation.xml').getroot()
          nav_ids = {n.attrib.get('id') for n in admin_nav.findall('nav')}
          if not {'warextAiAdmin', 'warextAiSettings'}.issubset(nav_ids):
              raise SystemExit('Ayrı ACP Warext AI navigasyonu eksik')

          permissions = ET.parse(data / 'permissions.xml').getroot()
          actual_permissions = {p.attrib.get('permission_id') for p in permissions.findall('permission')}
          required_permissions = {'warextAiViewSimple', 'warextAiViewDetailed', 'warextAiReview', 'warextAiManage'}
          if not required_permissions.issubset(actual_permissions):
              raise SystemExit('Yetki tanımları eksik')

          options = ET.parse(data / 'options.xml').getroot()
          option_ids = {o.attrib.get('option_id') for o in options.findall('option')}
          required_options = {
              'warextAiEnabled', 'warextAiMinChars', 'warextAiForums', 'warextAiExternalProvider',
              'warextAiDailyRequestLimit', 'warextAiMonthlyRequestLimit',
              'warextAiDailyBudgetUsd', 'warextAiMonthlyBudgetUsd',
              'warextAiEstimatedInputUsdPerMillion', 'warextAiEstimatedOutputUsdPerMillion',
              'warextAiUsageRetentionDays', 'warextAiHistoryBatchSize'
          }
          if not required_options.issubset(option_ids):
              raise SystemExit('Stable ayarları eksik: ' + ', '.join(sorted(required_options - option_ids)))

          phrases = ET.parse(data / 'phrases.xml').getroot()
          phrase_titles = {p.attrib.get('title') for p in phrases.findall('phrase')}
          required_phrases = {
              'option_warextAiDailyRequestLimit', 'option_warextAiMonthlyRequestLimit',
              'option_warextAiDailyBudgetUsd', 'option_warextAiMonthlyBudgetUsd',
              'option_warextAiEstimatedInputUsdPerMillion', 'option_warextAiEstimatedOutputUsdPerMillion',
              'option_warextAiUsageRetentionDays', 'option_warextAiHistoryBatchSize'
          }
          if not required_phrases.issubset(phrase_titles):
              raise SystemExit('Stable phrase kayıtları eksik')

          cron = ET.parse(data / 'cron_entries.xml').getroot()
          cron_ids = {e.attrib.get('cron_entry_id') for e in cron.findall('cron_entry')}
          if 'warextAiUsagePrune' not in cron_ids:
              raise SystemExit('Usage prune cron eksik')

          setup = (root / 'Setup.php').read_text(encoding='utf-8')
          for marker in [
              'installStep1', 'uninstallStep1', 'upgrade1000080Step1', 'upgrade1000090Step1',
              'upgrade1000110Step1', 'upgrade1000170Step1', 'upgrade1000190Step1', 'upgrade1000200Step1',
              'xf_warext_ai_analysis', 'xf_warext_ai_review_log', 'xf_warext_ai_usage',
              'similarity_metrics', 'cost_source', 'forum_date'
          ]:
              if marker not in setup:
                  raise SystemExit('Install/upgrade/uninstall şeması eksik: ' + marker)
          for drop in [
              "dropTable('xf_warext_ai_usage')",
              "dropTable('xf_warext_ai_review_log')",
              "dropTable('xf_warext_ai_analysis')"
          ]:
              if drop not in setup:
                  raise SystemExit('Uninstall temizliği eksik: ' + drop)

          post = (root / 'XF/Entity/Post.php').read_text(encoding='utf-8')
          for marker in [
              'Registry', 'UserProfile', 'Similarity', 'warextPrepareExternalState',
              'warextQueueExternalVerification', 'enqueueUnique', 'ExternalVerify',
              'similarity_metrics', 'content_fingerprint', 'existingHash', 'hash_equals'
          ]:
              if marker not in post:
                  raise SystemExit('Post analiz zinciri eksik: ' + marker)
          if '(new ExternalVerifier())->enrich' in post:
              raise SystemExit('Harici provider mesaj kaydı sırasında senkron çalışmamalı')

          provider = root / 'Provider'
          for name in [
              'ProviderInterface.php','LocalProvider.php','Registry.php','OpenRouterProvider.php',
              'AbstractJsonProvider.php','OpenAICompatibleProvider.php','OpenAIProvider.php',
              'GeminiProvider.php','DeepSeekProvider.php','AnthropicProvider.php'
          ]:
              if not (provider / name).exists():
                  raise SystemExit('Provider mimarisi eksik: ' + name)

          registry = (provider / 'Registry.php').read_text(encoding='utf-8')
          for marker in ['openrouter','openai','gemini','deepseek','anthropic','xai','mistral','qwen','ollama','custom_openai']:
              if marker not in registry:
                  raise SystemExit('Provider registry kaydı eksik: ' + marker)

          usage = root / 'Service/UsageTracker.php'
          usage_text = usage.read_text(encoding='utf-8')
          for marker in [
              'canRequest', 'record', 'summary', 'prune', 'daily_request_limit',
              'monthly_request_limit', 'daily_budget_limit', 'monthly_budget_limit',
              'warextAiEstimatedInputUsdPerMillion', 'warextAiEstimatedOutputUsdPerMillion',
              "costSource = 'actual'", "costSource = 'estimated'", 'cost_source',
              'hasInputPrice', 'hasOutputPrice', 'COUNT(*) AS monthly_requests',
              'SUM(IF(created_date >= ?, 1, 0))'
          ]:
              if marker not in usage_text:
                  raise SystemExit('Stable kullanım/bütçe özelliği eksik: ' + marker)
          if 'fetchOne(' in usage_text:
              raise SystemExit('Stable UsageTracker tekrar çoklu period fetchOne sorgularına dönmüş')

          verifier = (root / 'Service/ExternalVerifier.php').read_text(encoding='utf-8')
          for marker in ['UsageTracker', 'canRequest', 'external_budget_limit', 'usage_summary', 'external_provider_verification', 'recordedUsage', 'cost_source']:
              if marker not in verifier:
                  raise SystemExit('Harici doğrulama entegrasyonu eksik: ' + marker)

          historical = (root / 'Service/HistoricalAnalyzer.php').read_text(encoding='utf-8')
          history_job = (root / 'Job/HistoricalScan.php').read_text(encoding='utf-8')
          for marker in ['historical_unobserved', 'historical_behavior_unavailable', 'includeExternal', 'ExternalVerify', 'similarity_metrics']:
              if marker not in historical:
                  raise SystemExit('Geçmiş analiz özelliği eksik: ' + marker)
          for marker in ['NOT EXISTS', 'warextAiHistoryBatchSize', 'include_external', 'resume()', 'canCancel', 'ORDER BY p.post_id ASC']:
              if marker not in history_job:
                  raise SystemExit('HistoricalScan güvenli kuyruk akışı eksik: ' + marker)

          external_job = (root / 'Job/ExternalVerify.php').read_text(encoding='utf-8')
          for marker in ["['post_id' => $postId]", 'hash_equals', 'ExternalVerifier']:
              if marker not in external_job:
                  raise SystemExit('Harici job içerik-hash koruması eksik: ' + marker)

          report = (root / 'Pub/Controller/Report.php').read_text(encoding='utf-8')
          for marker in [
              'canManage', 'UsageTracker', 'actionHistoryScan', 'warextAiHistoryScan',
              'include_external', 'similarityMetrics', 'if ($this->canViewDetailed())',
              "SUM(review_state = 'pending')", "SUM(review_state = 'suspicious')",
              "SUM(review_state = 'confirmed')", "SUM(review_state = 'cleared')"
          ]:
              if marker not in report:
                  raise SystemExit('Stable rapor akışı eksik: ' + marker)
          if "SELECT COUNT(*) FROM xf_warext_ai_analysis WHERE review_state" in report:
              raise SystemExit('Moderasyon durum sayaçları tekrar ayrı sorgulara dönmüş')

          report_ui = Path('upload/js/warext/ai-content-inspector/report-ui.js').read_text(encoding='utf-8')
          for marker in ['costSourceLabels', 'Gerçek maliyet', 'Tahmini maliyet', 'Maliyet kaynağı', 'similarityMetrics']:
              if marker not in report_ui:
                  raise SystemExit('Detay rapor Stable görünümü eksik: ' + marker)

          modifications = (data / 'template_modifications.xml').read_text(encoding='utf-8')
          for marker in ['?wai=1000300', 'warextAiViewSimple', 'warext_ai_daily_cost_sources', 'warext_ai_monthly_cost_sources']:
              if marker not in modifications:
                  raise SystemExit('Stable template/cache entegrasyonu eksik: ' + marker)

          templates = (data / 'templates.xml').read_text(encoding='utf-8')
          for marker in ['Harici AI kullanımı ve provider sağlığı', 'Geçmiş içerik taraması', 'usage.providers', 'history-scan']:
              if marker not in templates:
                  raise SystemExit('Yönetim arayüzü eksik: ' + marker)

          prune = root / 'Cron/UsagePrune.php'
          if not prune.exists() or 'UsageTracker' not in prune.read_text(encoding='utf-8'):
              raise SystemExit('Usage prune callback eksik')

          print(json.dumps({
              'status':'ok',
              'version':'1.0.0',
              'versionId':1000300,
              'permissions':sorted(required_permissions),
              'localFirst':True,
              'externalOptional':True,
              'externalAsyncJob':True,
              'contentHashGuard':True,
              'providerArchitecture':True,
              'providerHealthSummary':True,
              'requestAndBudgetLimits':True,
              'actualCostTracking':True,
              'estimatedCostFallback':True,
              'partialEstimateRejected':True,
              'singleBudgetAggregateQuery':True,
              'singlePeriodSummaryQuery':True,
              'singleModerationCountQuery':True,
              'usageRetentionCron':True,
              'historicalScanJob':True,
              'similarityMetricsPersisted':True,
              'duplicateAnalysisGuard':True,
              'permissionAwareReporting':True,
              'installUpgradeUninstallChecked':True
          }, ensure_ascii=False))
          PY
