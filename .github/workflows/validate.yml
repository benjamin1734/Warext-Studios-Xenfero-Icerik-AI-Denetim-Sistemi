name: Warext AI Content Inspector Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: find upload/src/addons/Warext/AIContentInspector -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Analyzer false-positive regresyonları
        run: php tests/analyzer_regression.php

      - name: OpenRouter provider regresyonları
        run: php tests/openrouter_provider_regression.php

      - name: Doğrudan provider regresyonları
        run: php tests/direct_provider_regression.php

      - name: OpenAI-compatible provider regresyonları
        run: php tests/openai_compatible_provider_regression.php

      - name: JavaScript syntax
        run: find upload/js/warext/ai-content-inspector -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: XenForo data and architecture validation
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('upload/src/addons/Warext/AIContentInspector')
          addon = json.loads((root / 'addon.json').read_text(encoding='utf-8'))
          if addon.get('version_string') != '1.0.0 Alpha 10' or int(addon.get('version_id', 0)) != 1000160:
              raise SystemExit('Beklenmeyen addon sürümü')
          if int(addon.get('require', {}).get('XF', [0])[0]) < 2030070:
              raise SystemExit('XenForo 2.3+ gereksinimi eksik')
          if 'Warext/TurkishSpellCheck' in json.dumps(addon, ensure_ascii=False):
              raise SystemExit('Writing Checker zorunlu bağımlılık olamaz')

          data = root / '_data'
          for path in sorted(data.glob('*.xml')):
              ET.parse(path)

          permissions = ET.parse(data / 'permissions.xml').getroot()
          actual = {p.attrib.get('permission_id') for p in permissions.findall('permission')}
          required = {'warextAiViewSimple', 'warextAiViewDetailed', 'warextAiReview', 'warextAiManage'}
          if not required.issubset(actual):
              raise SystemExit('Yetki tanımları eksik')

          options = ET.parse(data / 'options.xml').getroot()
          option_ids = {o.attrib.get('option_id') for o in options.findall('option')}
          required_options = {
              'warextAiForums', 'warextAiExternalProvider',
              'warextAiOpenRouterEnabled', 'warextAiOpenRouterKey',
              'warextAiOpenRouterModel', 'warextAiOpenRouterFallbackModels',
              'warextAiOpenRouterRoutingSort', 'warextAiOpenRouterZdrOnly',
              'warextAiOpenRouterDenyDataCollection', 'warextAiOpenRouterResponseCache',
              'warextAiOpenRouterMinRisk', 'warextAiOpenRouterWeight',
              'warextAiOpenRouterMaxChars', 'warextAiOpenRouterTimeout',
              'warextAiOpenAIKey', 'warextAiOpenAIModel',
              'warextAiGeminiKey', 'warextAiGeminiModel',
              'warextAiDeepSeekKey', 'warextAiDeepSeekModel',
              'warextAiAnthropicKey', 'warextAiAnthropicModel',
              'warextAiXaiKey', 'warextAiXaiModel',
              'warextAiMistralKey', 'warextAiMistralModel',
              'warextAiQwenKey', 'warextAiQwenModel', 'warextAiQwenBaseUrl',
              'warextAiOllamaBaseUrl', 'warextAiOllamaModel',
              'warextAiCustomBaseUrl', 'warextAiCustomKey', 'warextAiCustomModel',
              'warextAiDirectMinRisk', 'warextAiDirectWeight',
              'warextAiDirectMaxChars', 'warextAiDirectTimeout'
          }
          if not required_options.issubset(option_ids):
              raise SystemExit('Provider ACP seçenekleri eksik: ' + ', '.join(sorted(required_options - option_ids)))

          phrases = ET.parse(data / 'phrases.xml').getroot()
          phrase_titles = {p.attrib.get('title') for p in phrases.findall('phrase')}
          required_phrases = {
              'option_warextAiExternalProvider', 'option_warextAiExternalProvider_explain',
              'option_warextAiOpenAIKey', 'option_warextAiGeminiKey',
              'option_warextAiDeepSeekKey', 'option_warextAiAnthropicKey',
              'option_warextAiXaiKey', 'option_warextAiMistralKey',
              'option_warextAiQwenKey', 'option_warextAiQwenBaseUrl',
              'option_warextAiOllamaBaseUrl', 'option_warextAiOllamaModel',
              'option_warextAiCustomBaseUrl', 'option_warextAiCustomModel',
              'option_warextAiDirectMinRisk', 'option_warextAiDirectWeight'
          }
          missing_phrases = required_phrases - phrase_titles
          if missing_phrases:
              raise SystemExit('Provider phrase eksik: ' + ', '.join(sorted(missing_phrases)))

          post = (root / 'XF/Entity/Post.php').read_text(encoding='utf-8')
          for marker in ['Registry', 'UserProfile', 'Similarity', 'warextPrepareExternalState', 'warextQueueExternalVerification', 'enqueueUnique', 'ExternalVerify', 'external_metrics', 'content_fingerprint', 'authoredTextLength', 'selectedExternalId', 'externalConfig', 'provider_not_implemented']:
              if marker not in post:
                  raise SystemExit('Post analiz/provider queue zinciri eksik: ' + marker)
          if '(new ExternalVerifier())->enrich' in post:
              raise SystemExit('Harici provider çağrısı mesaj kaydı sırasında senkron çalışmamalı')
          if 'Warext\\TurkishSpellCheck' in post:
              raise SystemExit('Writing Checker sınıfına hard dependency bulundu')

          job = root / 'Job/ExternalVerify.php'
          if not job.exists():
              raise SystemExit('Harici provider arka plan jobı eksik')
          job_text = job.read_text(encoding='utf-8')
          for marker in ['extends AbstractJob', 'Registry', 'isExternalEnabled', 'ExternalVerifier', 'content_hash', 'hash_equals', "SELECT message FROM xf_post", 'return $this->complete()']:
              if marker not in job_text:
                  raise SystemExit('Harici provider job koruması eksik: ' + marker)

          provider = root / 'Provider'
          provider_files = [
              'ProviderInterface.php', 'LocalProvider.php', 'Registry.php', 'OpenRouterProvider.php',
              'AbstractJsonProvider.php', 'OpenAICompatibleProvider.php',
              'OpenAIProvider.php', 'GeminiProvider.php', 'DeepSeekProvider.php', 'AnthropicProvider.php'
          ]
          for name in provider_files:
              if not (provider / name).exists():
                  raise SystemExit('Provider mimarisi eksik: ' + name)

          registry = (provider / 'Registry.php').read_text(encoding='utf-8')
          for marker in ['selectedExternalId', 'external()', 'isExternalEnabled', 'externalConfig', 'openAI()', 'gemini()', 'deepSeek()', 'anthropic()', 'xAI()', 'mistral()', 'qwen()', 'ollama()', 'customOpenAI()']:
              if marker not in registry:
                  raise SystemExit('Provider Registry kaydı eksik: ' + marker)
          for marker in ['warextAiExternalProvider', 'warextAiOpenRouterRoutingSort', 'warextAiOpenRouterDenyDataCollection', 'warextAiOpenRouterResponseCache', 'warextAiOpenAIKey', 'warextAiGeminiKey', 'warextAiDeepSeekKey', 'warextAiAnthropicKey', 'warextAiXaiKey', 'warextAiMistralKey', 'warextAiQwenBaseUrl', 'warextAiOllamaBaseUrl', 'warextAiCustomBaseUrl', 'warextAiDirectTimeout']:
              if marker not in registry:
                  raise SystemExit('Provider ACP ayarı Registryye bağlı değil: ' + marker)
          for provider_id in ['openai', 'gemini', 'deepseek', 'anthropic', 'xai', 'mistral', 'qwen', 'ollama', 'custom_openai']:
              marker = "'" + provider_id + "' => ['label'"
              pos = registry.find(marker)
              if pos == -1 or "'implemented' => true" not in registry[pos:pos + 260]:
                  raise SystemExit('Provider implemented=true değil: ' + provider_id)

          openrouter = (provider / 'OpenRouterProvider.php').read_text(encoding='utf-8')
          for marker in ['https://openrouter.ai/api/v1/chat/completions', 'Authorization', 'openrouter/auto', 'sanitizeAuthoredText', 'request_failed', "'sort'", "'data_collection'", "'usage' => ['include' => true]", 'X-OpenRouter-Cache']:
              if marker not in openrouter:
                  raise SystemExit('OpenRouter adapter/rota özelliği eksik: ' + marker)

          abstract = (provider / 'AbstractJsonProvider.php').read_text(encoding='utf-8')
          for marker in ['sanitizeAuthoredText', 'parseJson', 'normalizeResponse', 'systemPrompt', 'request_failed', 'max_chars']:
              if marker not in abstract:
                  raise SystemExit('Ortak doğrudan provider çekirdeği eksik: ' + marker)

          compatible = (provider / 'OpenAICompatibleProvider.php').read_text(encoding='utf-8')
          for marker in ['chatCompletionsUrl', 'isValidBaseUrl', "['http', 'https']", "isset($parts['user'])", "'Authorization'", "'messages'", "'temperature' => 0"]:
              if marker not in compatible:
                  raise SystemExit('OpenAI-compatible provider güvenlik/istek özelliği eksik: ' + marker)

          direct_checks = {
              'OpenAIProvider.php': ['https://api.openai.com/v1/responses', 'max_output_tokens', 'output_text'],
              'GeminiProvider.php': ['generativelanguage.googleapis.com', ':generateContent', 'responseMimeType', 'usageMetadata'],
              'DeepSeekProvider.php': ['https://api.deepseek.com/chat/completions', 'response_format', "'thinking'", 'json_object'],
              'AnthropicProvider.php': ['https://api.anthropic.com/v1/messages', 'anthropic-version', 'x-api-key', 'max_tokens']
          }
          for name, markers in direct_checks.items():
              text = (provider / name).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(name + ' adapter özelliği eksik: ' + marker)

          for marker in ['https://api.x.ai/v1', 'grok-4.6', 'https://api.mistral.ai/v1', 'mistral-small-latest', 'dashscope-intl.aliyuncs.com/compatible-mode/v1', 'qwen3.8-flash', '127.0.0.1:11434/v1', 'llama3.2']:
              if marker not in registry:
                  raise SystemExit('OpenAI-compatible Registry varsayılanı eksik: ' + marker)

          verifier = (root / 'Service/ExternalVerifier.php').read_text(encoding='utf-8')
          for marker in ['externalConfig', 'selectedExternalId', 'provider_not_implemented', 'external_provider_verification', 'below_local_risk_threshold']:
              if marker not in verifier:
                  raise SystemExit('Provider-neutral harici doğrulama eksik: ' + marker)
          if '(new Registry())->openRouter()' in verifier:
              raise SystemExit('ExternalVerifier doğrudan OpenRouter adapterına kilitlenmemeli')

          setup = (root / 'Setup.php').read_text(encoding='utf-8')
          for marker in ['upgrade1000080Step1', 'upgrade1000090Step1', 'upgrade1000110Step1', 'external_metrics', 'content_fingerprint', 'xf_warext_ai_review_log']:
              if marker not in setup:
                  raise SystemExit('Upgrade şeması eksik: ' + marker)

          controller = (root / 'Pub/Controller/Report.php').read_text(encoding='utf-8')
          for marker in ['actionIndex', 'actionThread', 'actionDetail', 'actionReview', 'high_risk_count', 'reviewHistory', 'externalMetrics']:
              if marker not in controller:
                  raise SystemExit('Rapor akışı eksik: ' + marker)

          print(json.dumps({
              'status':'ok', 'version':'1.0.0 Alpha 10', 'permissions':sorted(required),
              'hardDependency':False, 'providerArchitecture':True,
              'providerNeutralExternalVerifier':True, 'externalProviderSelector':True,
              'openRouterImplemented':True, 'openRouterRecommended':True,
              'openAIImplemented':True, 'geminiImplemented':True,
              'deepSeekImplemented':True, 'anthropicImplemented':True,
              'xAIImplemented':True, 'mistralImplemented':True,
              'qwenImplemented':True, 'ollamaImplemented':True,
              'customOpenAIImplemented':True,
              'openRouterCostGate':True, 'openRouterRoutingControls':True,
              'openRouterUsageMetrics':True, 'openRouterPrivacyControls':True,
              'externalAsyncJob':True, 'staleContentHashGuard':True,
              'threadAggregateReport':True, 'profileBaseline':True,
              'reviewAuditLog':True, 'contentFingerprint':True
          }, ensure_ascii=False))
          PY
