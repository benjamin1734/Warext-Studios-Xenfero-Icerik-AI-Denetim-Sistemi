name: Bilingual Release Notes Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bilingual-release-notes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update v1.1.4 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view 'v1.1.4' --json body --jq .body > /tmp/current.md
          cat > /tmp/en.md <<'EOF'
# Warext Studios | AI Content Inspector v1.1.4 Stable

Live false-negative fixes, manual deep analysis and a transparent scoring chain.

- Fixed the multi-signal calibration gap where the same text could remain around 28/100 risk and 56/100 confidence in live analysis.
- Sufficiently long texts carrying 5+ independent strong language/structure signals are no longer treated as if they only contained isolated weak signals.
- A low-risk plus low/medium-confidence result is no longer treated as evidence of human authorship; when necessary it falls back to `Uncertain / insufficient confidence`.
- Manual message analysis can force an external second opinion when an external provider is configured, even if the local risk is below the normal API threshold.
- If a background external-verification job is already queued, no duplicate API call is made; the inline report automatically follows the final result.
- When local and external scores strongly conflict, neither side wins blindly; the result is escalated to review level and a conflict signal is recorded.
- The inline report exposes the Raw local score → Calibrated local score → External provider score → Final score chain, together with the engine version and calibration reason.
- The interface explicitly states that the risk value is a moderation risk score, not a mathematical percentage probability that the content was AI-generated.
- `LocalCalibration` and `ExternalScoreFusion` are mandatory for the Stable ZIP and are covered by dedicated regression tests.

No manual SQL is required. Upgrade the existing installation without uninstalling it by uploading `Warext-XenForo-Icerik-AI-Denetim-Sistemi-V1.1.4.zip` from this release through XenForo.
EOF
          python3 - <<'PY'
          from pathlib import Path
          base = Path('/tmp/current.md').read_text(encoding='utf-8').rstrip()
          marker = '\n\n---\n\n## English\n'
          if marker in base:
              base = base.split(marker, 1)[0].rstrip()
          en = Path('/tmp/en.md').read_text(encoding='utf-8').strip()
          Path('/tmp/final.md').write_text(base + marker + '\n' + en + '\n', encoding='utf-8')
          PY
          gh release edit 'v1.1.4' --notes-file /tmp/final.md
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/bilingual-release-notes.yml
          git commit -m 'Release notu geçici işini temizle' || exit 0
          git push || true
